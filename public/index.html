<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dotville — a tiny world of dots</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#12151c;color:#dfe5ee;font:14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:8px 12px;background:#1a1f2a;border-bottom:1px solid #262d3b}
header b{font-size:16px;letter-spacing:.3px}
.pill{color:#9fb0c8;white-space:nowrap}.pill i{font-style:normal;color:#e8eef8}
.sp{flex:1}
button{background:#273044;color:#e8eef8;border:0;border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
button:active{background:#34415c}button:disabled{opacity:.4}button.on{background:#3b6ea8}
main{flex:1;display:flex;min-height:0}
#stage{position:relative;flex:1;min-width:0;background:#0d1016;display:flex;align-items:center;justify-content:center}
canvas{display:block;width:100%;touch-action:none;max-height:100%}
#zoom{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px}
#zoom button{width:34px;height:34px;padding:0;font-size:18px}
#live{position:absolute;left:10px;top:8px;color:#9fb0c8;font-size:12px;pointer-events:none;text-shadow:0 1px 2px #000}
aside{width:340px;display:flex;flex-direction:column;border-left:1px solid #262d3b;background:#161a23;min-height:0}
#card{padding:10px 12px;border-bottom:1px solid #262d3b;min-height:92px}
#card .hint{color:#7d8ba1}
#card h3{font-size:16px;display:flex;gap:8px;align-items:baseline}
#card h3 small{color:#8a9ab2;font-weight:400}
.bar{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:12px;color:#9fb0c8}.bar span{width:52px}
.bar div{flex:1;height:6px;background:#262d3b;border-radius:3px;overflow:hidden}.bar div i{display:block;height:100%}
.trs{margin-top:4px}.tr{display:inline-block;background:#2a3350;border-radius:8px;padding:1px 7px;font-size:12px;margin-right:4px;color:#c9d4e6}
.act{display:flex;gap:6px;margin-top:8px}.act button{flex:1;padding:6px 4px;font-size:13px}
#tabs{display:flex;gap:6px;padding:6px 10px;border-bottom:1px solid #262d3b}#tabs button{flex:1;background:#1f2634;padding:5px}#tabs button.on{background:#3b6ea8}
#town{display:none;flex:1;overflow:auto;padding:8px 12px}#town h4{margin:10px 0 4px;color:#9fb0c8;font-size:13px}#town .row{display:flex;justify-content:space-between;padding:5px 8px;background:#1d2330;border-radius:8px;margin-bottom:4px;cursor:pointer}#town .row i{font-style:normal;color:#9fb0c8}.tstats{color:#c9d4e6;line-height:1.7}
#ticker div.hot{border-left:3px solid #e0775a}#ticker div.big{border-left:3px solid #ffd45a;background:#222a3b}
.th{margin-top:6px;font-style:italic;color:#c9d4e6}.do{color:#9fb0c8;margin-top:2px}
.fr{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}.fr a{background:#252d3f;border-radius:10px;padding:1px 8px;cursor:pointer;font-size:12px}
#ticker{flex:1;overflow:auto;padding:4px 0}
#ticker div{padding:6px 12px;border-bottom:1px solid #1f2532;cursor:pointer;animation:in .5s}
#ticker div:active{background:#202738}
#ticker small{display:block;color:#6f7e95;font-size:11px}
@keyframes in{from{background:#2c3a57}to{background:transparent}}
@media (max-width:820px){main{flex-direction:column}aside{width:100%;flex:1;border-left:0;border-top:1px solid #262d3b}#stage{flex:none}header{padding:6px 10px}.hide-m{display:none}}
</style>
</head>
<body>
<div id="app">
  <header>
    <b>● Dotville</b>
    <span class="pill" id="clock">Day –</span>
    <span class="pill">pop <i id="pop">–</i></span>
    <span class="pill">mood <i id="mood">–</i></span>
    <span class="pill hide-m">food <i id="food">–</i></span>
    <span class="pill hide-m">couples <i id="fr">–</i></span>
    <span class="pill">👀 <i id="viewers">1</i></span>
    <span class="sp"></span>
    <button id="bFest" title="Everyone goes to the park">🎉 Festival</button>
    <button id="bBlight" title="Crops fail for 40s">🥀 Blight</button>
    <button id="bTr" class="on" title="Show translations">🌐</button>
    <button id="bCam" class="on" title="Auto-camera follows the drama">🎥</button>
    <button id="bSpd" style="display:none">⏩ ×1</button>
  </header>
  <main>
    <div id="stage"><canvas id="c"></canvas><div id="live"></div>
      <div id="zoom"><button id="zi">+</button><button id="zo">−</button></div></div>
    <aside><div id="card"><div class="hint">Tap a dot to follow it.<br>Watch for speech bubbles — dots speak their own language; 🌐 shows the translation.</div></div>
      <div id="tabs"><button class="on" data-t="feed">Feed</button><button data-t="town">Town</button></div><div id="ticker"></div><div id="town"></div></aside>
  </main>
</div>
<script src="worldgen.js"></script>
<script src="sim.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const LOCAL = !!window.__LOCAL__ || /[?&]local/.test(location.search);
const JOBCOL = ['#7bd36b', '#f0a74a', '#b98cf0', '#59b6ee'];
let W, H, tiles, wk, el, setts = [], blds = [], dots = [], lex = [], names = [], fams = [], bnames = [], JOBS = [], BTN = [];
let tod = 0.3, day = 1, occ = [], sel = -1, follow = false, translate = true, bubbles = [], statsM = null;
let stat = null, detail = null, ready = false, lastClock = '';
const TRI = { thief: '🥷', hothead: '🔥', gossip: '💬', kind: '💖', romantic: '🌹', jealous: '💚', coward: '🐥', ambitious: '⭐', lazy: '💤' };
const parts = [];
let auto = true, userAt = -1e9, dirUntil = 0, dirIds = null, lastShot = -1e9, deadTimer = null, tab = 'feed';
const colFor = n => { let x = 7; for (let i = 0; i < n.length; i++) x = (x * 31 + n.charCodeAt(i)) % 3600; return `hsl(${x / 10},68%,62%)`; };
const cam = { x: 0, y: 0, z: 1 }; let camTarget = null;
const cv = $('#c'), ctx = cv.getContext('2d');
let cssW = 300, cssH = 200, fit = 5, dpr = 1;

/* ---------- transport ---------- */
let ws = null, localWorld = null, localSpeed = 1;
function send(m) { if (LOCAL) localSend(m); else if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); }
function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.binaryType = 'arraybuffer';
  ws.onmessage = e => { if (typeof e.data === 'string') handle(JSON.parse(e.data)); else frame(e.data); };
  ws.onclose = () => { $('#live').textContent = 'reconnecting…'; setTimeout(connect, 1500); };
  ws.onopen = () => { if (sel >= 0) send({ t: 'sel', id: sel }); };
}
function startLocal() {
  localWorld = new Sim.World({});
  handle(localWorld.initMsg());
  $('#bSpd').style.display = ''; $('#live').textContent = 'local sim (just you)';
  setInterval(() => {
    for (let i = 0; i < localSpeed; i++) { localWorld.step(); if (localWorld.tick % 5 === 0 && i < localSpeed - 1) { const q = localWorld.drain(); if (q.length) handle({ t: 'batch', m: q }); } }
    frame(localWorld.frame());
    let ms = localWorld.drain(); if (ms.length > 400) ms = ms.slice(-400);
    if (ms.length) handle({ t: 'batch', m: ms });
    if (localWorld.tick % 5 === 0) { const s = localWorld.statsMsg(); s.viewers = 1; handle(s); if (sel >= 0) handle(localWorld.detail(sel)); }
  }, 200);
}
function localSend(m) { if (m.t === 'act') localWorld.act(m.n, m.id); }

/* ---------- messages ---------- */
function handle(m) {
  switch (m.t) {
    case 'init': init(m); break;
    case 'batch': for (const x of m.m) handle(x); break;
    case 'ev': ticker(m); break;
    case 'say': say(m); break;
    case 'born': dots[m.id] = Object.assign(dots[m.id] || { id: m.id, x: 0, y: 0, tx: 0, ty: 0, fx: 0, fy: 0, t0: 0, fl: 64 }, { name: m.name, job: m.j, home: m.h, traits: m.tr || [], seen: false, col: colFor(m.name) }); names[m.id] = m.name; fams[m.id] = m.f || ''; break;
    case 'bld': bldUpd(m); break;
    case 'tiles': { const a = tiles.split(''); for (const [i, v] of m.c) a[i] = v; tiles = a.join(''); terrDirty = true; break; }
    case 'stats': stat = m; hud(); break;
    case 'detail': detail = m; card(); break;
  }
}
function init(m) {
  W = m.W; H = m.H; tiles = m.tiles; wk = m.wk; setts = m.setts; blds = m.blds; lex = m.lex; JOBS = m.jobs; BTN = m.bt;
  const bin = atob(m.el); el = new Uint8Array(W * H); for (let i = 0; i < el.length; i++) el[i] = bin.charCodeAt(i);
  dots = m.dots.map((d, i) => ({ id: i, name: d.n, job: d.j, home: d.h, traits: d.tr || [], col: colFor(d.n), x: 0, y: 0, tx: 0, ty: 0, fx: 0, fy: 0, t0: 0, fl: 0, seen: false }));

  bnames = blds.map(bname);
  buildStatic(); resize(); cam.x = W / 2; cam.y = H / 2; cam.z = 1; occ = []; ready = true;
  $('#ticker').innerHTML = ''; (m.hist || []).forEach(e => ticker(e, false));
}
const bname = b => b.n ? b.n + ' ' + BTN[b.ty] : 'House';
function bldUpd(m) {
  const b = m.b; if (m.op === 'del') b.st = 3;
  blds[b.i] = b; bnames[b.i] = bname(b);
}
function frame(buf) {
  if (!ready) return;

  const now = performance.now(); let o = 15;

    const d = dots[i] || (dots[i] = { id: i, name: 'newcomer', job: 0, home: 0, traits: [], col: '#ccc', x: 0, y: 0, tx: 0, ty: 0, fx: 0, fy: 0, t0: 0, fl: 0, seen: false }); if (!names[i]) names[i] = d.name;
    const x = v.getUint16(o, true) / 16, y = v.getUint16(o + 2, true) / 16;
    d.fx = d.seen ? d.x : x; d.fy = d.seen ? d.y : y; d.tx = x; d.ty = y; d.t0 = now; d.fl = v.getUint8(o + 4); d.seen = true;
  }
  occ = []; for (let i = 0; i < nb; i++, o += 2) occ.push(v.getUint16(o, true));
}
const clk = () => { const h = tod * 24, hh = Math.floor(h), mm = Math.floor((h - hh) * 60); return (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm + (h < 6 || h >= 20 ? ' 🌙' : h < 8 ? ' 🌅' : h >= 18 ? ' 🌇' : ' ☀️'); };
function hud() {
  $('#pop').textContent = stat.pop; $('#mood').textContent = stat.mood; $('#fr').textContent = stat.couples; if (tab === 'town') town(); $('#viewers').textContent = stat.viewers;
  const fa = stat.food; $('#food').textContent = fa.length ? Math.round(fa.reduce((a, b) => a + b, 0) / fa.length) + ' avg · ' + Math.min(...fa) + ' min' : '–';
  const f = $('#bFest'), b = $('#bBlight');
  f.disabled = stat.cd.festival > 0; b.disabled = stat.cd.blight > 0;
  f.textContent = stat.fest ? '🎉 On!' : stat.cd.festival > 0 ? `🎉 ${stat.cd.festival}s` : '🎉 Festival';
  b.textContent = stat.blight ? '🥀 On!' : stat.cd.blight > 0 ? `🥀 ${stat.cd.blight}s` : '🥀 Blight';
}
function ticker(m, live) {
  const el = document.createElement('div'); el.className = (m.w || 1) >= 4 ? 'big' : (m.w || 1) >= 3 ? 'hot' : '';
  if (live !== false) director(m);
  el.innerHTML = m.x.replace(/</g, '&lt;') + `<small>${clk()} · day ${day}</small>`;
  if (m.ids && m.ids.length) el.onclick = () => select(m.ids[0]);
  const t = $('#ticker'); t.prepend(el); while (t.children.length > 60) t.lastChild.remove();
}
function tokWord(k) { return k >= 3000 ? (setts[k - 3000] ? setts[k - 3000].n : '?') : k >= 2000 ? ((blds[k - 2000] || {}).n || 'home') : k >= 1000 ? names[k - 1000] : lex[k][0]; }
function tokGloss(k) { return k >= 3000 ? (setts[k - 3000] ? setts[k - 3000].n : '?') : k >= 2000 ? (bnames[k - 2000] || 'home') : k >= 1000 ? names[k - 1000] : lex[k][1]; }
function say(m) {
  const k = m.k, inv = k.map(tokWord).join(' '), en0 = k.map(tokGloss).join(' ');
  const en = en0[0].toUpperCase() + en0.slice(1) + (lex[36] && k[0] === 36 ? '!' : '.');
  if (m.d !== undefined) { bubbles = bubbles.filter(b => b.d !== m.d); }
  bubbles.push({ d: m.d, b: m.b, inv, en, t0: performance.now() });
  if (bubbles.length > 60) bubbles.shift();
}
function card() {
  const c = $('#card'); if (sel < 0 || !detail || detail.id !== sel) return;
  const dt = detail, bar = (n, v, col) => `<div class="bar"><span>${n}</span><div><i style="width:${v}%;background:${col}"></i></div></div>`;
  const cd = a => (stat && stat.cd[a] > 0) ? ` ${stat.cd[a]}s` : '';
  const dis = a => (stat && stat.cd[a] > 0) || dt.dead ? 'disabled' : '';
  c.innerHTML = `<h3>${dt.name} ${dt.fam || ''} <small>${dt.job} · age ${dt.age} · ${dt.coin} coins · mood ${dt.mood}</small></h3>
    <div class="trs">${dt.mayor ? '<span class="tr" style="background:#6b5a1f">🏛️ mayor</span>' : ''}${dt.traits.map(t => `<span class="tr">${TRI[t]} ${t}</span>`).join('')}</div>
    <div class="do">${dt.doing}${dt.partner ? ` · ${dt.married ? '💍' : '💘'} <a data-i="${dt.pid}" style="text-decoration:underline;cursor:pointer">${dt.partner}</a>` : ''}</div>
    ${bar('hunger', dt.hunger, '#e0775a')}${bar('energy', dt.energy, '#e6c65a')}${bar('social', dt.social, '#7fb0f0')}
    <div class="th">“${dt.thought}”</div>
    <div class="do">✨ Dream: ${dt.dream}${dt.thieves.length ? ` · 🥷 distrusts ${dt.thieves.map(i => names[i]).join(', ')}` : ''}</div>
    <div class="fr">${dt.friends.length ? dt.friends.map(f => `<a data-i="${f[0]}">${names[f[0]]}</a>`).join('') : '<span class="hint" style="color:#7d8ba1">no close friends yet</span>'}</div>
    <div class="act"><button data-a="gift" ${dis('gift')}>🎁 +30${cd('gift')}</button><button data-a="cupid" ${dis('cupid')}>💘 Cupid${cd('cupid')}</button><button data-a="zap" ${dis('zap')}>⚡ Zap${cd('zap')}</button></div>`;
  c.querySelectorAll('a[data-i]').forEach(a => a.onclick = () => select(+a.dataset.i));
  c.querySelectorAll('button[data-a]').forEach(b => b.onclick = () => send({ t: 'act', n: b.dataset.a, id: sel }));
  if (dt.dead && !deadTimer) deadTimer = setTimeout(() => { deadTimer = null; if (sel === dt.id) select(-1); }, 4000);
}
function town() {
  if (!stat || !stat.lead) return; const L = stat.lead;
  const row = (t, arr, f) => `<h4>${t}</h4>` + arr.map(([id, v], i) => `<div class="row" data-i="${id}"><span>${i + 1}. ${names[id]}</span><i>${f(v)}</i></div>`).join('');
  const mayor = stat.mayor >= 0 ? `<div class="row" data-i="${stat.mayor}"><span>🏛️ Mayor ${names[stat.mayor]} ${fams[stat.mayor]}</span><i>tax ${stat.tax}/day</i></div><div class="tstats" style="margin:4px 0 6px">Treasury ${stat.treasury} coins · next election day ${stat.nextElection}</div>` : '';
  const B = stat.biz || {}, tw = (stat.towns || []).map(([n, t, p]) => `<div class="row"><span>${['👑', '🏘️', '🏡', '🛖'][t]} ${n}</span><i>${p}</i></div>`).join('');
  const eco = `<div class="tstats" style="margin:6px 0">🏪 ${B.open} businesses open · 🏗️ ${B.sites} building sites · 🚪 ${B.vacant} vacant<br>📈 ${B.built} built · 📉 ${B.closed} failed · 🤝 ${B.sold} sold · 🔥 ${B.fires} fires · 🧳 ${B.arrived} arrived</div>`;
  $('#town').innerHTML = mayor + `<h4>Settlements</h4>` + tw + eco + `<div class="tstats">💑 ${stat.couples} couples · 👶 ${stat.births} born · 🕯️ ${stat.deaths} died<br>🚨 ${stat.thefts} robberies · 🥊 ${stat.fights} brawls · 🍞 ${stat.food.join(' / ')}</div>`
    + row('💰 Richest', L.rich, v => v + ' coins') + row('❤️ Most loved', L.loved, v => v) + row('😡 Most hated', L.hated, v => v) + row('🧓 Oldest', L.old, v => v + ' yrs');
  $('#town').querySelectorAll('.row').forEach(r => r.onclick = () => select(+r.dataset.i));
}
function director(m) {
  if (!auto || !ready || !m.ids || !m.ids.length || (m.w || 1) < 3) return;
  const now = performance.now();
  if (now - userAt < 18000) return;
  if (now - lastShot < 7000 && m.w < 4) return;
  lastShot = now; dirUntil = now + 9000; dirIds = m.ids.slice(0, 2);

function pick_(id, user) {
  if (user) { userAt = performance.now(); dirIds = null; }
  sel = id; follow = id >= 0; detail = null;
  if (id >= 0) { send({ t: 'sel', id }); camTarget = (dirIds && dirIds.length > 1 ? 20 : 26) / fit; $('#card').innerHTML = `<h3>${dots[id].name}</h3><div class="do">…</div>`; if (LOCAL) handle(localWorld.detail(id)); }
  else { send({ t: 'sel', id: -1 }); camTarget = 1; $('#card').innerHTML = '<div class="hint">Tap a dot to follow it.<br>🎥 auto-camera cuts to the drama.</div>'; }

function select(id) { pick_(id, true); }

/* ---------- terrain layer (re-rendered when tiles change) + dynamic buildings ---------- */
let stat0 = null, terrDirty = false, terrAt = 0; const T0 = 12;
function hash(x, y) { let h = (x * 374761393 + y * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }

function calcShore() { // distance of water cells from land (for depth shading)

}
const E = (x, y) => el[Math.max(0, Math.min(H - 1, y)) * W + Math.max(0, Math.min(W - 1, x))] / 255;
const isW = (x, y) => x < 0 || y < 0 || x >= W || y >= H ? true : wk[y * W + x] !== '0';
function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
const css = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
function buildStatic() {

  const g = stat0.getContext('2d'), T = tiles;
  const tt = (x, y) => (x < 0 || y < 0 || x >= W || y >= H) ? -1 : +T[y * W + x];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, t = +T[i], r = hash(x, y), w = wk[i], px = x * T0, py = y * T0;
    let c;
    if (w !== '0') { // water
      const d = shoreD[i], deep = Math.min(1, d / 9);
      c = w === '1' ? mix([86, 160, 196], [28, 74, 120], deep) : w === '2' ? mix([96, 168, 200], [52, 118, 164], Math.min(1, d / 5)) : [84, 158, 204];
      c = mix(c, [255, 255, 255], r * 0.025);
    } else {
      const h = E(x, y), sh = (E(x - 1, y - 1) - E(x + 1, y + 1)) * 5.5;
      const base = t === 8 ? [214, 198, 148] : t === 9 ? [128, 126, 120] : mix(mix([88, 138, 78], [124, 150, 84], Math.min(1, h * 1.8)), [150, 130, 96], Math.max(0, h - 0.55) * 2.2);
      c = [base[0] + sh * 30 + (r - .5) * 7, base[1] + sh * 30 + (r - .5) * 7, base[2] + sh * 26 + (r - .5) * 6];
      if (t === 2) c = mix(c, [128, 108, 80], 0.55);
      if (t === 4) c = [176, 160, 130];

    const px = x * T0, py = y * T0;
