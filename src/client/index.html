<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dotville — a tiny world of dots</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#12151c;color:#dfe5ee;font:14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#card{padding:10px 12px;border-bottom:1px solid #262d3b;min-height:92px}
#card .hint{color:#7d8ba1}
#card h3{font-size:16px;display:flex;gap:8px;align-items:baseline}
#card h3 small{color:#8a9ab2;font-weight:400}
.bar{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:12px;color:#9fb0c8}.bar span{width:52px}
.bar div{flex:1;height:6px;background:#262d3b;border-radius:3px;overflow:hidden}.bar div i{display:block;height:100%}
.trs{margin-top:4px}.tr{display:inline-block;background:#2a3350;border-radius:8px;padding:1px 7px;font-size:12px;margin-right:4px;color:#c9d4e6}
.act{display:flex;gap:6px;margin-top:8px}.act button{flex:1;padding:6px 4px;font-size:13px}
#cast{display:none;flex:1;overflow:auto;padding:8px 10px}#cast .cc{display:flex;gap:10px;align-items:center;padding:7px 4px;border-bottom:1px solid #262d3b;cursor:pointer}#cast .cc canvas{flex:none;width:44px;height:44px;border-radius:8px;background:#222a3a}#cast .cc small{display:block;opacity:.7}#cast .cc b{font-size:13px}#note{position:fixed;right:12px;bottom:12px;max-width:300px;display:flex;flex-direction:column;gap:6px;z-index:9}#note div{background:#243049;border-left:3px solid #6fb1ff;padding:7px 10px;border-radius:6px;font-size:12px;box-shadow:0 2px 8px #0008}.face{width:36px;height:36px;border-radius:8px;background:#222a3a;vertical-align:middle}.wbtn{background:#2a3550;margin-left:6px}.wbtn.on{background:#3b6ea8}
#gazette{display:none;flex:1;overflow:auto;padding:10px 12px;background:#f6f0dc;color:#1d1a14}#gazette a{color:#6b3e1d}
#story{display:none;flex:1;overflow:auto;padding:8px 12px}#story h4{margin:10px 0 4px;color:#9fb0c8;font-size:13px}#story .row{display:flex;justify-content:space-between;gap:8px;padding:6px 8px;background:#1d2434;border-radius:6px;margin-bottom:4px;cursor:pointer}#story .chron{padding:6px 8px;border-left:3px solid #2c364b;margin-bottom:6px;cursor:pointer;font-size:12px}#story .chron.big{border-left-color:#ffd45a;background:#222a3b}#story .chron small{display:block;color:#6f7e95;font-size:10px}#story .chron b{display:block;font-size:12px}
#town{display:none;flex:1;overflow:auto;padding:8px 12px}#town h4{margin:10px 0 4px;color:#9fb0c8;font-size:13px}#town .row{display:flex;justify-content:space-between;padding:5px 8px;background:#1d2330;border-radius:8px;margin-bottom:4px;cursor:pointer}#town .row i{font-style:normal;color:#9fb0c8}.tstats{color:#c9d4e6;line-height:1.7}
#ticker div.hot{border-left:3px solid #e0775a}#ticker div.big{border-left:3px solid #ffd45a;background:#222a3b}
.th{margin-top:6px;font-style:italic;color:#c9d4e6}.do{color:#9fb0c8;margin-top:2px}
.fr{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}.fr a{background:#252d3f;border-radius:10px;padding:1px 8px;cursor:pointer;font-size:12px}
#ticker{flex:1;overflow:auto;padding:4px 0}
#ticker div{padding:6px 12px;border-bottom:1px solid #1f2532;cursor:pointer;animation:in .5s}
#ticker div:active{background:#202738}
#ticker b.x{display:inline-block;background:#2b3550;color:#aebfdc;border-radius:9px;padding:0 7px;font-size:11px;font-weight:600;margin-left:4px;vertical-align:1px}#ticker small{display:block;color:#6f7e95;font-size:11px}
@keyframes in{from{background:#2c3a57}to{background:transparent}}

:root{--amber:#ffcf5a;--coral:#ff6b5a;--ink:#e8eef8;--dim:#9fb0c8;--glass:rgba(16,20,29,.78);--glass-line:rgba(255,255,255,.09);--side-w:0px;--sheet-h:0px;--hud-h:48px}
html,body{overflow:hidden;font-variant-numeric:tabular-nums}
button{background:#273044;color:var(--ink);border:0;border-radius:10px;padding:7px 11px;font:inherit;cursor:pointer;min-height:34px}
button:active{background:#34415c}button:disabled{opacity:.4}button.on{background:#3b6ea8}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#app{position:fixed;inset:0;height:100dvh}
#stage{position:absolute;inset:0;background:#0a1c2c;overflow:hidden}
canvas#c{position:absolute;left:0;top:0;touch-action:none}
/* ---- HUD: the broadcast bar ---- */
#hud{position:absolute;left:10px;right:10px;top:10px;display:flex;align-items:center;gap:10px;padding:6px 8px 6px 12px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--glass-line);border-radius:14px;z-index:5;min-height:var(--hud-h)}
#hud .live{display:flex;align-items:center;gap:7px;font-weight:700;letter-spacing:.14em;font-size:12px;color:var(--ink)}
#hud .live i{width:9px;height:9px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 0 rgba(255,107,90,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(255,107,90,0)}100%{box-shadow:0 0 0 0 rgba(255,107,90,0)}}
#hud .brand{font-weight:700;font-size:15px;letter-spacing:.02em}
.pill{color:var(--dim);white-space:nowrap;font-size:13px}.pill i{font-style:normal;color:var(--ink)}
.sp{flex:1}
#drama{display:flex;align-items:center;gap:7px;color:var(--dim);font-size:12px;white-space:nowrap}
#drama .m{width:64px;height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
#drama .m i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,#7fb0f0,var(--amber),var(--coral));transition:width 1.2s}
#drama b{color:var(--ink);font-weight:600;min-width:52px}
#bMenu{background:rgba(255,255,255,.08)}
/* ---- meddle menu ---- */
#menu{position:absolute;right:10px;top:calc(var(--hud-h) + 18px);z-index:7;display:none;flex-direction:column;gap:6px;padding:10px;min-width:210px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--glass-line);border-radius:14px}
#menu.open{display:flex}#menu h5{font-size:11px;letter-spacing:.12em;color:var(--dim);font-weight:600;margin:4px 2px 0}
#menu button{text-align:left;display:flex;justify-content:space-between;gap:10px}
/* ---- story chips: what the storyteller is running right now ---- */
#chips{position:absolute;left:10px;top:calc(var(--hud-h) + 20px);display:flex;flex-direction:column;gap:6px;z-index:4;pointer-events:none;max-width:min(320px,calc(100% - var(--side-w) - 30px))}
#chips .chip{pointer-events:auto;cursor:pointer;padding:7px 11px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--glass-line);border-left:3px solid var(--amber);border-radius:10px;animation:in .6s}
#chips .chip b{display:block;font-size:12px;letter-spacing:.02em}#chips .chip small{display:block;color:var(--dim);font-size:11px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chips .chip em{font-style:normal;color:var(--amber);font-size:10px;letter-spacing:.12em;font-weight:700}
/* ---- lower third: who the camera is on, and why ---- */
#lt{position:absolute;left:14px;bottom:calc(var(--sheet-h) + 14px);z-index:4;display:none;align-items:stretch;max-width:min(420px,calc(100% - var(--side-w) - 90px));cursor:pointer;filter:drop-shadow(0 6px 18px rgba(0,0,0,.45))}
#lt.show{display:flex;animation:ltin .45s cubic-bezier(.2,.8,.2,1)}
@keyframes ltin{from{transform:translateX(-24px);opacity:0}}
#lt canvas{width:56px;height:56px;border-radius:12px 0 0 12px;background:#222a3a;flex:none}
#lt .tx{padding:7px 14px 8px 12px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--glass-line);border-left:0;border-radius:0 12px 12px 0;min-width:0}
#lt .k{font-size:10px;letter-spacing:.14em;font-weight:700;color:var(--amber)}
#lt .n{font-size:17px;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lt .s{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lt .w{font-size:13px;color:var(--ink);margin-top:3px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* ---- zoom ---- */
#zoom{position:absolute;right:calc(var(--side-w) + 14px);bottom:calc(var(--sheet-h) + 14px);display:flex;flex-direction:column;gap:6px;z-index:4}
#zoom button{width:40px;height:40px;padding:0;font-size:20px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--glass-line)}
#live{display:none}
/* ---- the side panel: a floating drawer on desktop, a bottom sheet on phones ---- */
aside{position:absolute;z-index:6;display:flex;flex-direction:column;min-height:0;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--glass-line)}
#grab{display:none}
#drawerBtn{position:absolute;z-index:6;top:calc(var(--hud-h) + 28px);right:10px;display:none;width:34px;height:34px;padding:0;background:var(--glass);border:1px solid var(--glass-line)}
#card{padding:10px 12px;border-bottom:1px solid var(--glass-line);min-height:92px;overflow:auto;max-height:54%}
#tabs{display:flex;gap:4px;padding:7px 8px;border-bottom:1px solid var(--glass-line)}
#tabs button{flex:1;background:rgba(255,255,255,.06);padding:6px 2px;font-size:13px}#tabs button.on{background:#3b6ea8}
details.more{margin-top:6px}details.more summary{cursor:pointer;color:var(--dim);font-size:12px;list-style:none}details.more summary::before{content:'▸ '}details.more[open] summary::before{content:'▾ '}
@media (min-width:821px){
  aside{top:calc(var(--hud-h) + 20px);right:10px;bottom:10px;width:372px;border-radius:16px;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
  #app.closed aside{transform:translateX(calc(100% + 20px))}
  #drawerBtn{display:block;right:calc(var(--side-w) - 22px + 10px)}
  #app.closed #drawerBtn{right:10px}
  #app{--side-w:392px}#app.closed{--side-w:0px}
}
@media (max-width:820px){
  #hud{left:8px;right:8px;top:8px;gap:8px;padding:5px 6px 5px 10px}
  #hud .brand,.hide-m,#drama b{display:none}#drama .m{width:44px}
  button{min-height:44px;padding:8px 12px}#zoom button{width:44px;height:44px}
  aside{left:0;right:0;bottom:0;border-radius:20px 20px 0 0;border-bottom:0;height:var(--sheet-h);padding-bottom:env(safe-area-inset-bottom)}
  #grab{display:block;flex:none;padding:9px 0 7px;touch-action:none;cursor:grab}#grab i{display:block;width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.28);margin:0 auto}
  #app[data-sheet=peek]{--sheet-h:118px}#app[data-sheet=half]{--sheet-h:46dvh}#app[data-sheet=full]{--sheet-h:86dvh}
  #app[data-sheet=peek] #card{display:none}
  /* the whole sheet scrolls as one column; the grab handle and tabs stay pinned */
  aside{overflow-y:auto;overscroll-behavior:contain}
  aside>*{flex-shrink:0}
  #bMenu{min-width:44px}
  #card{max-height:none;overflow:visible}
  #ticker,#town,#story,#gazette,#cast{flex:none!important;overflow:visible!important}
  #grab{position:sticky;top:0;z-index:3;background:rgba(18,22,31,.96)}
  #tabs{position:sticky;top:26px;z-index:3;background:rgba(18,22,31,.96)}
  #app[data-sheet=peek] #tabs{top:0}
  #lt{right:68px;max-width:none}
  #chips{max-width:calc(100% - 16px)}
  #zoom{right:10px}
}
#note{top:calc(var(--hud-h) + 24px)!important;bottom:auto!important;right:calc(var(--side-w) + 10px)!important;z-index:8}
@media (max-width:820px){#note{right:10px!important;top:calc(var(--hud-h) + 70px)!important}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app" data-sheet="peek">
  <div id="stage"><canvas id="c"></canvas></div>
  <header id="hud">
    <span class="live"><i></i><span id="live">LIVE</span></span>
    <span class="brand">Dotville</span>
    <span class="pill" id="clock">Day –</span>
    <span class="pill hide-m">pop <i id="pop">–</i></span>
    <span class="pill hide-m">mood <i id="mood">–</i></span>
    <span class="pill hide-m">food <i id="food">–</i></span>
    <span class="pill hide-m">couples <i id="fr">–</i></span>
    <span class="sp"></span>
    <span id="drama" title="Storyteller tension: how much drama is in the air"><span class="m"><i></i></span><b>calm</b></span>
    <span class="pill">👀 <i id="viewers">1</i></span>
    <button id="bMenu" aria-haspopup="true" aria-expanded="false" title="Meddle, translations, camera">⚙<span class="hide-m"> Meddle</span></button>
  </header>
  <div id="menu" role="menu">
    <h5>NUDGE FATE</h5>
    <button id="bFest" title="Everyone goes to the park">🎉 Festival</button>
    <button id="bBlight" title="Crops fail for 40s">🥀 Blight</button>
    <h5>VIEW</h5>
    <button id="bTr" class="on" title="Show translations">🌐 Translate speech</button>
    <button id="bCam" class="on" title="Auto-camera follows the drama">🎥 Auto-camera</button>
    <button id="bSpd" style="display:none">⏩ ×1</button>
  </div>
  <div id="chips" aria-live="polite"></div>
  <div id="lt" role="button" tabindex="0" aria-label="Open this character"><canvas id="ltface" width="56" height="56"></canvas><div class="tx"><div class="k" id="ltk"></div><div class="n" id="ltn"></div><div class="s" id="lts"></div><div class="w" id="ltw"></div></div></div>
  <div id="zoom"><button id="zi" aria-label="Zoom in">+</button><button id="zo" aria-label="Zoom out">−</button></div>
  <button id="drawerBtn" aria-label="Show or hide the panel" title="Show or hide the panel">›</button>
  <aside id="side">
    <div id="grab" aria-label="Drag to resize the panel"><i></i></div>
    <div id="card"><div class="hint">Tap a dot to follow it.<br>Watch for speech bubbles — dots speak their own language; 🌐 shows the translation.</div></div>
    <div id="tabs"><button class="on" data-t="feed">Wire</button><button data-t="town">Country</button><button data-t="story">Stories</button><button data-t="gazette">Gazette</button><button data-t="cast">Cast</button></div>
    <div id="ticker"></div><div id="town"></div><div id="story"></div><div id="gazette"></div><div id="cast"></div>
  </aside>
</div>
<script src="client.js"></script>
<div id="note"></div></body>
</html>
